[package]
name = "monitornap"
version = "2.0.0"
description = "Turn off your displays with a single click - A tiny, cross-platform tray utility"
authors = ["BDenizKoca"]
license = "MIT"
repository = "https://github.com/BDenizKoca/MonitorNap"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri framework
tauri = { version = "2.1", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-autostart = "2.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Monitor control - DDC/CI
ddc-hi = "0.4"
display-info = "0.5"

# Global hotkeys
global-hotkey = "0.6"

# System tray (already included in tauri features)
# tray-icon is part of tauri

# Window management and input monitoring
rdev = "0.5"

# Time utilities
chrono = "0.4"

# Cross-platform directories
dirs = "5.0"

# Lazy static for globals
once_cell = "1.20"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
] }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"   # Strip panic cleanup logic
codegen-units = 1 # Compile crates one after another for better optimization
lto = true        # Enable link-time optimization
opt-level = "z"   # Optimize for size
strip = true      # Strip symbols from binary
